<script>
/* Inject all registered slides into deck-stage */
(function () {
  var stage = document.querySelector('deck-stage');
  (window.__slides || []).forEach(function (slideHtml) {
    var tmp = document.createElement('div');
    tmp.innerHTML = slideHtml;
    while (tmp.firstElementChild) stage.appendChild(tmp.firstElementChild);
  });
  var secs = stage.querySelectorAll(':scope > section');
  secs.forEach(function (s, i) {
    var n = s.querySelector('.slide-num');
    if (!n) n = Array.prototype.find.call(s.querySelectorAll('*'), function (el) { return !el.children.length && /^\s*\d+\s*\/\s*\d+\s*$/.test(el.textContent); });
    if (n) { n.textContent = (i + 1) + ' / ' + secs.length; if (parseFloat(getComputedStyle(n).fontSize) < 24) n.style.fontSize = '24px'; }
  });
})();
</script>
